packages:
  - name: required_libraries
    description: Install essential libraries for building and developing software
    category: Development Tools
    tasks:
      - type: apt
        action: install
        packages:
          - build-essential
          - pkg-config
          - autoconf
          - bison
          - clang
          - rustc
          - libssl-dev
          - libreadline-dev
          - zlib1g-dev
          - libyaml-dev
          - libreadline-dev
          - libncurses5-dev
          - libffi-dev
          - libgdbm-dev
          - libjemalloc2
          - imagemagick
          - libmagickwand-dev
          - libmysqlclient-dev
          - libpq-dev
          - dos2unix
