packages:
  - name: docker
    description: Install Docker for containerization and application deployment
    category: Containerization
    tasks:
      - type: shell
        command: |
          if [ ! -f /etc/apt/keyrings/docker.asc ]; then
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
          fi
      - type: shell
        command: |
          if ! grep -q 'docker' /etc/apt/sources.list /etc/apt/sources.list.d/*; then
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          fi
      # Use shell command for apt-get update to ensure it works on KDE Neon
      - type: shell
        command: sudo apt-get update
      - type: apt
        action: install
        packages:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - docker-ce-rootless-extras
      # Add the current user to the 'docker' group
      - type: shell
        command: |
          if ! groups $USER | grep -q docker; then
            sudo usermod -aG docker $USER
            echo -e "\033[1;33mNOTICE: You have been added to the 'docker' group.\033[0m"
            echo -e "\033[1;33mYou may need to log out and back in for this to take effect.\033[0m"
          fi
      # Configure Docker daemon logging
      - type: shell
        command: |
          sudo mkdir -p /etc/docker
          echo '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"5"}}' | sudo tee /etc/docker/daemon.json
      - type: shell
        command: sudo systemctl restart docker
      - type: shell
        command: |
          # Try to run docker version
          if ! docker --version &>/dev/null; then
            echo -e "\033[1;31mWarning: Unable to run Docker commands without sudo.\033[0m"
            echo -e "\033[1;33mThis is normal if you've just been added to the 'docker' group.\033[0m"
            echo -e "\033[1;33mYou can either:\033[0m"
            echo "  1. Log out and log back in to apply the group changes"
            echo "  2. Run 'newgrp docker' in your terminal to use Docker in this session"
            echo "  3. Use 'sudo docker' for now"

            # Show version using sudo as a fallback
            echo -e "\033[1;32mDocker version (using sudo):\033[0m"
            sudo docker --version

            # Apply the group change to the current shell session
            echo -e "\033[1;32mApplying 'docker' group to current session...\033[0m"
            exec sg docker -c "echo Docker group applied to current session"
          else
            echo -e "\033[1;32mDocker is properly installed and configured:\033[0m"
            docker --version
          fi

          # Fix socket permissions as a fallback
          if [ ! -w /var/run/docker.sock ] && [ -e /var/run/docker.sock ]; then
            echo -e "\033[1;33mFixing Docker socket permissions...\033[0m"
            sudo chmod 666 /var/run/docker.sock
            echo -e "\033[1;32mTemporary permission fix applied to Docker socket.\033[0m"
            echo -e "\033[1;33mNote: This is a temporary fix and will be reset after reboot.\033[0m"
          fi
    dependencies: [ca-certificates, curl]
